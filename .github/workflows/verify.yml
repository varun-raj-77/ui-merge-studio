name: UI Merge Studio verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read-only CI: no repository write token, deployment credentials, or secrets.
permissions:
  contents: read

concurrency:
  group: ums-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, build, and browser smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # Keep a space in the checkout path: the preview-runtime integration
    # regression exercises Vite instrumentation under spaced workspaces.
    defaults:
      run:
        working-directory: UI merge studio
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: UI merge studio

      - name: Configure Node (matches Vercel)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: UI merge studio/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate the disposable controlled Git fixture
        run: npm run fixture:create

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit and integration tests
        run: npm test

      - name: Verify fixture ancestry and inclusion/exclusion contracts
        run: npm run fixture:verify

      - name: Validate committed Showcase evidence
        run: npm run showcase:validate

      - name: Build hosted Showcase
        run: npm run build

      - name: Install Chromium for bounded browser smoke
        run: npx playwright install --with-deps chromium

      - name: Check hosted/local boundary and keyboard navigation in browser
        run: npx playwright test -c apps/studio/playwright.config.ts tests/e2e/guided-experience.spec.ts

      - name: Confirm checks did not change tracked source files
        run: git diff --exit-code
