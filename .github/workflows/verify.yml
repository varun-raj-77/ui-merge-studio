name: UI Merge Studio verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read-only CI: no repository write token, deployment credentials, or secrets.
permissions:
  contents: read

concurrency:
  group: ums-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, build, and browser journeys
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # Keep a space in the checkout path: the preview-runtime integration
    # regression exercises Vite instrumentation under spaced workspaces.
    defaults:
      run:
        working-directory: UI merge studio
    steps:
      - name: Checkout source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: UI merge studio
          persist-credentials: false

      - name: Configure Node (matches Vercel)
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: UI merge studio/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate the disposable controlled Git fixture
        run: npm run fixture:create

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit and integration tests
        run: npm test

      - name: Verify fixture ancestry and inclusion/exclusion contracts
        run: npm run fixture:verify

      - name: Validate committed Showcase evidence
        run: npm run showcase:validate

      - name: Build hosted Showcase
        run: npm run build

      - name: Install Chromium for bounded browser journeys
        # Includes Playwright's required Linux libraries. Keeping --with-deps
        # matters more than shaving minutes by skipping system dependencies.
        # Bound this independently so an OS-package mirror cannot consume the
        # full job timeout without yielding a diagnosable failed step.
        timeout-minutes: 20
        run: |
          set -euo pipefail
          npx playwright --version
          started="$(date +%s)"
          npx playwright install --with-deps chromium
          finished="$(date +%s)"
          echo "Chromium and system dependencies installed in $((finished - started)) seconds."

      - name: Check real Showcase journeys, configured plans, and safe refusal in browser
        run: >-
          npx playwright test -c apps/studio/playwright.config.ts
          tests/e2e/guided-experience.spec.ts
          tests/e2e/showcase-evidence.spec.ts
          tests/e2e/integration-plan.spec.ts
          tests/e2e/foundation-support.spec.ts

      # Controlled local fixture only. Both tests are hermetic with explicit
      # preview and candidate-branch cleanup; no unrelated repositories run.
      - name: Verify real local plan to Git candidate and provenance refusal
        run: >-
          npx playwright test -c apps/studio/playwright.config.ts
          tests/e2e/local-canonical-plan.spec.ts
          tests/e2e/local-selection-provenance.spec.ts

      # Local Chromium, first-party synthesized React/Vite branches only.
      # The candidate is created, verified and browsed in a disposable Git
      # worktree; no production traffic or external repository execution.
      - name: Verify two-feature Git candidate in real Chromium
        run: >-
          npx playwright test -c apps/studio/playwright.config.ts
          tests/e2e/two-feature-candidate-browser.spec.ts

      - name: Recheck generated fixture after real candidate cleanup
        run: npm run fixture:verify

      - name: Confirm checks did not change tracked source files
        run: git diff --exit-code
