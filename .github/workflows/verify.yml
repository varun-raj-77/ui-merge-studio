name: UI Merge Studio verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read-only CI: no repository write token, deployment credentials, or secrets.
permissions:
  contents: read

concurrency:
  group: ums-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, build, and browser journeys
    runs-on: ubuntu-24.04
    # Match the locked @playwright/test version. The official Playwright image
    # already contains Chromium and its Linux libraries, so browser CI does
    # not depend on the runner's occasionally unreachable Ubuntu apt mirror.
    container:
      image: mcr.microsoft.com/playwright:v1.53.1-noble
      # Reap orphaned Vite/npm descendants. Without an init process, group
      # probes can keep seeing container zombies even after SIGKILL.
      options: --init
    timeout-minutes: 40
    # GitHub's container-runner command wrapper does not support spaces in its
    # working-directory. The preview-runtime test creates a disposable
    # spaced-path alias itself, so this checkout remains representative.
    defaults:
      run:
        working-directory: ui-merge-studio
    steps:
      - name: Checkout source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: ui-merge-studio
          persist-credentials: false

      - name: Configure Node (matches Vercel)
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui-merge-studio/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate the disposable controlled Git fixture
        run: npm run fixture:create

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit and integration tests
        run: npm test

      - name: Verify fixture ancestry and inclusion/exclusion contracts
        run: npm run fixture:verify

      - name: Validate committed Showcase evidence
        run: npm run showcase:validate

      - name: Build hosted Showcase
        run: npm run build

      - name: Verify pinned Chromium and dependency environment
        run: |
          set -euo pipefail
          test "$(node -p 'require("@playwright/test/package.json").version')" = '1.53.1'
          node --input-type=module -e '
            import { chromium } from "@playwright/test";
            const browser = await chromium.launch();
            console.log(`Playwright Chromium launch succeeded: ${browser.version()}`);
            await browser.close();
          '

      - name: Check real Showcase journeys, configured plans, and safe refusal in browser
        run: >-
          npx playwright test -c apps/studio/playwright.config.ts
          tests/e2e/guided-experience.spec.ts
          tests/e2e/showcase-evidence.spec.ts
          tests/e2e/integration-plan.spec.ts
          tests/e2e/foundation-support.spec.ts

      # Controlled local fixture only. Both tests are hermetic with explicit
      # preview and candidate-branch cleanup; no unrelated repositories run.
      - name: Verify real local plan to Git candidate and provenance refusal
        run: >-
          npx playwright test -c apps/studio/playwright.config.ts
          tests/e2e/local-canonical-plan.spec.ts
          tests/e2e/local-selection-provenance.spec.ts

      # Local Chromium, first-party synthesized React/Vite branches only.
      # The candidate is created, verified and browsed in a disposable Git
      # worktree; no production traffic or external repository execution.
      - name: Verify two-feature Git candidate in real Chromium
        run: >-
          npx playwright test -c apps/studio/playwright.config.ts
          tests/e2e/two-feature-candidate-browser.spec.ts

      # Scoped to a synthesized app; never captures arbitrary repository UI.
      # The same viewport is recorded before transfer, with compiled CSS,
      # and after disabling only the compiled stylesheet.
      - name: Capture CSS Module Git candidate visual counterexample
        run: >-
          npx playwright test -c apps/studio/playwright.config.ts
          tests/e2e/css-module-real-candidate.spec.ts

      - name: Publish controlled CSS visual evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ums-css-visual-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: ui-merge-studio/test-results/ums-css-module-visual-evidence/
          if-no-files-found: warn
          retention-days: 14

      - name: Recheck generated fixture after real candidate cleanup
        run: npm run fixture:verify

      - name: Confirm checks did not change tracked source files
        run: git diff --exit-code
