name: Pre-interview hardening

on:
  push:
    branches:
      - codex/pre-interview-hardening-2026-10-07
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test:source-analysis
      - run: npm run test:preview-runtime
      - run: npm run test:studio
      - run: npm test
      - run: npm run fixture:create
      - run: npm run fixture:verify
      - run: npm run build
      - run: git diff --check
